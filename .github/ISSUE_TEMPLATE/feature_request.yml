name: Feature request
description: Propose a new addition to the report, design files or documentation
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: Describe the addition or improvement.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What does this add for someone reading or reusing the report?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, related issues or edge cases to watch for.
    validations:
      required: false
